<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cake Delight - Payment</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #fff7fa;
      font-family: Arial, sans-serif;
    }

    .payment-box {
      max-width: 500px;
      margin: 70px auto;
      background: white;
      padding: 32px;
      border-radius: 18px;
      box-shadow: 0 8px 22px rgba(217, 75, 125, 0.18);
    }

    h2 {
      color: #d94b7d;
      font-weight: bold;
    }

    .pay-btn {
      background: #d94b7d;
      color: white;
      border: none;
      border-radius: 25px;
      padding: 10px;
      width: 100%;
    }

    .pay-btn:hover {
      background: #b93867;
      color: white;
    }
  </style>
</head>

<body>
  <div class="payment-box">
    <h2 class="text-center mb-4">Payment Details</h2>

    <div class="mb-3">
      <strong>Selected Cake:</strong>
      <span id="cakeName">---</span>
    </div>

    <div class="mb-4">
      <strong>Price:</strong>
      ₹<span id="cakePrice">0</span>
    </div>

    <form id="paymentForm">
      <input type="text" class="form-control mb-3" placeholder="Card Holder Name" required>
      <input type="text" class="form-control mb-3" placeholder="Card Number" required>
      <div class="row">
        <div class="col">
          <input type="text" class="form-control mb-3" placeholder="MM/YY" required>
        </div>
        <div class="col">
          <input type="password" class="form-control mb-3" placeholder="CVV" required>
        </div>
      </div>

      <button type="submit" class="pay-btn">Pay Now</button>
    </form>
  </div>

  <script>
    
  const params = new URLSearchParams(window.location.search);

  document.getElementById("cakeName").textContent =
    params.get("cake") || "No cake selected";

  document.getElementById("cakePrice").textContent =
    params.get("price") || "0";

  document.getElementById("paymentForm").addEventListener("submit", function (event) {
    event.preventDefault();

    const cakeName = document.getElementById("cakeName").textContent;
    const cakePrice = document.getElementById("cakePrice").textContent;

    alert(`Payment successful!\n\nCake: ${cakeName}\nAmount Paid: ₹${cakePrice}\n\nThank you for ordering from Cake Delight!`);

    this.reset(); // clears all card/payment fields
  });
</script>










  
</body>
</html>
