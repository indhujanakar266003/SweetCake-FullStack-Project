<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="review.css">
</head>
<body>
    <!-- style -->
     <style>
        * {
    box-sizing: border-box;
}

body {
    margin: 0;

    background: white;

    font-family: Arial, sans-serif;

    color: #111;
}


/* ================= FORM ================= */

.review-form {

    max-width: 950px;

    margin: auto;

    padding: 18px;

    border: 1px solid #eeeeee;

    border-radius: 12px;

    background: white;
}


/* ================= HEADER ================= */

.form-heading {

    display: flex;

    align-items: center;

    gap: 12px;

    margin-bottom: 18px;
}

.form-number {

    width: 48px;

    height: 48px;

    background: #e7195f;

    color: white;

    border-radius: 7px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 25px;

    font-weight: bold;
}

.form-heading h2 {

    margin: 0;

    color: #d71958;

    font-size: 27px;

    font-weight: 700;
}

.form-heading p {

    margin: 3px 0 0;

    color: #551548;

    font-size: 13px;

    font-weight: 600;
}

.form-heading p span {

    color: #e7195f;

    margin: 0 6px;
}


/* ================= SECTIONS ================= */

.review-section,
.contact-section {

    border: 1px solid #eeeeee;

    border-radius: 9px;

    padding: 15px;

    height: 100%;
}

.review-section h5,
.contact-section h5 {

    color: #c91655;

    font-size: 15px;

    font-weight: 700;

    margin-bottom: 16px;
}


/* ================= LABEL ================= */

label {

    display: block;

    margin-top: 11px;

    margin-bottom: 5px;

    font-size: 11px;

    font-weight: 700;
}


/* ================= INPUT ================= */

.form-control {

    height: 35px;

    font-size: 12px;

    border: 1px solid #dddddd;

    border-radius: 5px;
}

.form-control:focus {

    border-color: #e7195f;

    box-shadow: 0 0 0 2px rgba(231, 25, 95, 0.1);
}


/* ================= RATING ================= */

.rating {

    display: flex;

    gap: 10px;

    margin: 4px 0 12px;
}

.star {

    font-size: 31px;

    line-height: 1;

    color: #e7195f;

    cursor: pointer;

    transition: 0.2s;
}

.star:hover {

    transform: scale(1.1);
}


/* ================= TEXTAREA ================= */

.review-text {

    height: 118px !important;

    resize: none;

    line-height: 1.4;
}

.message-text {

    height: 88px !important;

    resize: none;
}


/* ================= CHARACTER COUNT ================= */

.character-count {

    text-align: right;

    margin-top: -22px;

    margin-right: 8px;

    margin-bottom: 8px;

    font-size: 10px;

    color: #333;

    position: relative;
}


/* ================= BUTTON ================= */

.submit-btn {

    width: 100%;

    border: none;

    border-radius: 5px;

    padding: 9px;

    background: #e7195f;

    color: white;

    font-size: 13px;

    font-weight: 600;

    margin-top: 12px;

    cursor: pointer;
}

.submit-btn:hover {

    background: #c91451;
}


/* ================= MOBILE ================= */

@media (max-width: 767px) {

    .review-form {

        padding: 12px;
    }

    .form-heading h2 {

        font-size: 20px;
    }

    .form-heading p {

        font-size: 10px;
    }

    .star {

        font-size: 27px;
    }

}
     </style>


<!-- Html -->
 

<div class="container py-4">

    <div class="review-form">


        <!-- ================= HEADER ================= -->

        <div class="form-heading">

            

            <div>

                <h2>
                    REVIEW & CONTACT FORM
                </h2>

                <p>
                    Reviews
                    <span>•</span>
                    Contact / Messages
                </p>

            </div>

        </div>


        <!-- ================= MAIN ================= -->

        <div class="row g-3">


            <!-- ================= REVIEW ================= -->

            <div class="col-md-6">

                <div class="review-section">

                    <h5>
                        WRITE A REVIEW
                    </h5>


                    <!-- ORDER ID -->

                    <label>
                        Order ID
                    </label>

                    <input
                        type="text"
                        id="reviewOrderId"
                        class="form-control"
                        value=""
                    >


                    <!-- RATING -->

                    <label>
                        Your Rating
                    </label>

                    <div class="rating">

                        <span
                            class="star"
                            onclick="setRating(1)"
                        >
                            ★
                        </span>

                        <span
                            class="star"
                            onclick="setRating(2)"
                        >
                            ★
                        </span>

                        <span
                            class="star"
                            onclick="setRating(3)"
                        >
                            ★
                        </span>

                        <span
                            class="star"
                            onclick="setRating(4)"
                        >
                            ★
                        </span>

                        <span
                            class="star"
                            onclick="setRating(5)"
                        >
                            ☆
                        </span>

                    </div>


                    <!-- REVIEW -->

                    <label>
                        Your Review
                    </label>

                    <textarea
                        id="reviewText"
                        class="form-control review-text"
                        maxlength="200"
                        placeholder="Write your review..."
                        oninput="updateReviewCount()"
                    ></textarea>

                    <div class="character-count">
                        <span id="reviewCount">83</span>/200
                    </div>


                    <!-- SUBMIT -->

                    <button
                        type="button"
                        class="submit-btn"
                        onclick="submitReview()"
                    >
                        Submit Review
                    </button>

                </div>

            </div>


            <!-- ================= CONTACT ================= -->

            <div class="col-md-6">

                <div class="contact-section">

                    <h5>
                        CONTACT US
                    </h5>


                    <!-- NAME -->

                    <label>
                        Your Name
                    </label>

                    <input
                        type="text"
                        id="contactName"
                        class="form-control"
                        value=""
                    >


                    <!-- EMAIL -->

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        id="contactEmail"
                        class="form-control"
                        value=""
                    >


                    <!-- SUBJECT -->

                    <label>
                        Subject
                    </label>

                    <select
                        id="contactSubject"
                        class="form-control"
                    >

                        <option>
                            General Inquiry
                        </option>

                        <option>
                            Order Related
                        </option>

                        <option>
                            Cake Customization
                        </option>

                        <option>
                            Payment Issue
                        </option>

                        <option>
                            Delivery Issue
                        </option>

                        <option>
                            Other
                        </option>

                    </select>


                    <!-- MESSAGE -->

                    <label>
                        Message
                    </label>

                    <textarea
                        id="contactMessage"
                        class="form-control message-text"
                        maxlength="300"
                        placeholder="Type your message here..."
                        oninput="updateMessageCount()"
                    ></textarea>

                    <div class="character-count message-count">
                        <span id="messageCount">0</span>/300
                    </div>


                    <!-- SEND -->

                    <button
                        type="button"
                        class="submit-btn"
                        onclick="sendMessage()"
                    >
                        Send Message
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>


<script src="review.js"></script>

</body>

</html>
    
</body>
</html>
