<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Form</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <style>
    body {
      background-color: #fdf4f8;
      font-family: Arial, sans-serif;
    }

    .login-box {
      width: 370px;
      max-width: 92%;
      margin: 50px auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
      overflow: hidden;
    }

    .tabs {
      display: flex;
      justify-content: space-around;
      border-bottom: 1px solid #eee;
    }

    .tabs a {
      border: none;
      background: none;
      padding: 13px 8px;
      font-size: 12px;
    }

    .tabs a {
      color: #e60065;
      border-bottom: 3px solid #e60065;
      font-weight: bold;
    }

    .form-area {
      padding: 25px;
    }

    .cake-icon img{
      width: 100px;
      height: 100px;
      margin: auto;
      border-radius: 50%;
      background-color: #ffe0ec;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 38px;
    }

    .login-btn {
      width: 100%;
      background-color: #df0864;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
    }

    .login-btn:hover {
      background-color: #b9004e;
    }

    .small-link {
      color: #df0864;
      text-decoration: none;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="login-box">
     <p style="color: #df0864; text-align: center; font-size: 25px;">Registration </p>
    <div class="tabs">
     
     <a href="#" > Login</a>
      <a href="#">Register</a>
      <a href="">Forgot Password?</a>
    </div>

    <div class="form-area">
      <div class="text-center">
        <div class="cake-icon"><img src="pinkcake.png" alt=""></div>
        <h5 class="mt-3 mb-1">Welcome Back!</h5>
        <small class="text-muted">Login to your account</small>
      </div>

      <form id="loginForm">
        <label class="mt-3 mb-1">Name</label>
        <input type="text" id="name" class="form-control" placeholder="Enter your name"/>

        <label class="mt-3 mb-1">Email Address</label>
        <input type="text" id="email" class="form-control" placeholder="Enter your email"/>

        <label class="mt-3 mb-1">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter your password"/>

        <div class="d-flex justify-content-between mt-3">
          <label style="font-size: 12px;">
            <input type="checkbox" /> Remember Me
          </label>

          <a href="#" class="small-link">Forgot Password?</a>
        </div>

        <button type="submit" class="login-btn mt-3">Login</button>

        <p class="text-center mt-3" style="font-size: 12px;">
          Don't have an account?
          <a href="#" class="small-link">Register</a>
        </p>
      </form>
    </div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function (event) {
      event.preventDefault();

      let name = document.getElementById("name").value.trim();
      let email = document.getElementById("email").value.trim();
      let password = document.getElementById("password").value.trim();

      if (name === "") {
        alert("Please enter your name!");
        return;
      }

     else if (email === "") {
        alert("Please enter your email!");
        return;
      }

     else if (!email.includes("@")) {
        alert("Email must contain @ symbol!");
        return;
      }

      else if (password === "") {
        alert("Please enter your password!");
        return;
      }

      alert("Login successful! Welcome " + name + " 🎂");
    });
  </script>

</body>
</html>
