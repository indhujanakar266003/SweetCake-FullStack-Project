<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cake Browse / Search</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #ffffff;
    font-family: Arial, sans-serif;
    color: #171717;
}


/* MAIN CONTAINER */

.browse-container {
    max-width: 700px;
    margin: auto;
    border: 1px solid #eeeeee;
    border-radius: 12px;
    padding: 15px;
    background: #ffffff;
}


/* HEADER */

.form-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
}

.form-number {
    width: 45px;
    height: 45px;
    background: #e7195f;
    color: white;
    border-radius: 7px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 22px;
    font-weight: bold;
}

.form-header h2 {
    margin: 0;
    color: #d71958;
    font-size: 24px;
    font-weight: 700;
}

.form-header p {
    margin: 3px 0 0;
    color: #57134a;
    font-weight: 600;
}

.form-header p span {
    color: #d71958;
    margin: 0 7px;
}


/* SEARCH */

.search-box {
    display: flex;
    border: 1px solid #dddddd;
    border-radius: 8px;
    overflow: hidden;
    height: 48px;
}

.search-box input {
    border: none;
    box-shadow: none !important;
}

.search-box button {
    width: 55px;
    border: none;
    background: #e7195f;
    color: white;
    font-size: 20px;
}


/* SECTION TITLE */

.section-title {
    margin-top: 20px;
    margin-bottom: 12px;
    font-weight: 700;
    color: #181818;
}


/* CATEGORIES */

.categories {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
}

.category {
    width: 72px;
    text-align: center;
    cursor: pointer;
}

.category-icon {
    width: 48px;
    height: 48px;

    margin: auto;

    border-radius: 50%;

    background: #fff0f6;
    color: #e7195f;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 21px;

    transition: 0.3s;
}

.category span {
    display: block;
    margin-top: 6px;
    font-size: 12px;
    font-weight: 600;
}

.category:hover .category-icon,
.category.active .category-icon {
    background: #e7195f;
    color: white;
}


/* FILTER */

.filter-label {
    display: block;
    font-weight: 700;
    margin-bottom: 7px;
}

.price-values {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 600;
}

.form-range {
    accent-color: #e7195f;
}

.form-select {
    height: 44px;
    border-radius: 7px;
}


/* POPULAR BOX */

.popular-box {
    border: 1px solid #eeeeee;
    border-radius: 10px;
    padding: 18px;
    height: 100%;
}

.popular-box h5 {
    font-weight: 700;
    margin-bottom: 15px;
}


/* POPULAR CAKE */

.popular-cake {
    display: flex;
    align-items: center;
    gap: 12px;

    padding: 10px 0;

    border-bottom: 1px solid #eeeeee;
}

.popular-cake img {
    width: 75px;
    height: 75px;

    object-fit: cover;

    border-radius: 8px;
}

.cake-info {
    flex: 1;
}

.cake-info h6 {
    margin-bottom: 4px;
    font-weight: 700;
}

.cake-info strong {
    display: block;
    margin-bottom: 6px;
}

.cake-info button {
    border: none;
    background: #e7195f;
    color: white;

    padding: 5px 10px;

    border-radius: 5px;

    font-size: 12px;
    font-weight: 600;
}


/* VIEW MORE */

.view-more {
    border: none;
    background: transparent;

    color: #d71958;

    font-weight: 700;

    margin-top: 15px;

    width: 100%;
}


/* EXTRA CAKE CARDS */

.cake-card {
    border: 1px solid #eeeeee;
    border-radius: 10px;
    padding: 10px;
}

.cake-card img {
    width: 100%;
    height: 130px;
    object-fit: cover;
    border-radius: 7px;
}

.cake-card h6 {
    margin-top: 8px;
    font-weight: 700;
}

.cake-card button {
    width: 100%;
    border: none;
    background: #e7195f;
    color: white;
    border-radius: 5px;
    padding: 7px;
}


/* RESPONSIVE */

@media (max-width: 991px) {

    .form-header h2 {
        font-size: 24px;
    }

    .categories {
        gap: 10px;
    }

}


@media (max-width: 576px) {

    .browse-container {
        padding: 12px;
    }

    .form-header h2 {
        font-size: 19px;
    }

    .form-header p {
        font-size: 12px;
    }

    .category {
        width: 60px;
    }

    .category-icon {
        width: 42px;
        height: 42px;
    }

    .popular-cake img {
        width: 65px;
        height: 65px;
    }

}


</style>








<div class="container-fluid py-4">

    <div class="browse-container">

        <!-- FORM HEADER -->
        <div class="form-header">
            

            <div>
                <h2>CAKE BROWSE / SEARCH </h2>
                <p>
                    Browse Cakes
                    <span>•</span>
                    Search
                    <span>•</span>
                    Categories
                    <span>•</span>
                    Filters
                </p>
            </div>
        </div>


        <div class="row g-4">

            <!-- LEFT SIDE -->
            <div class="col-12">

                <!-- SEARCH -->
                <div class="search-box">
                    <input
                        type="text"
                        id="searchInput"
                        class="form-control"
                        placeholder="Search cakes..."
                    >

                    <button onclick="searchCake()">
                        <i class="bi bi-search"></i>
                    </button>
                </div>


                <!-- CATEGORIES -->
                <h5 class="section-title">Categories</h5>

                <div class="categories">

                    <div class="category active" onclick="filterCategory('All')">
                        <div class="category-icon">
                            <i class="bi bi-grid"></i>
                        </div>
                        <span>All Cakes</span>
                    </div>

                    <div class="category" onclick="filterCategory('Birthday')">
                        <div class="category-icon">
                            <i class="bi bi-balloon"></i>
                        </div>
                        <span>Birthday</span>
                    </div>

                    <div class="category" onclick="filterCategory('Anniversary')">
                        <div class="category-icon">
                            <i class="bi bi-heart"></i>
                        </div>
                        <span>Anniversary</span>
                    </div>

                    <div class="category" onclick="filterCategory('Photo')">
                        <div class="category-icon">
                            <i class="bi bi-image"></i>
                        </div>
                        <span>Photo Cakes</span>
                    </div>

                    <div class="category" onclick="filterCategory('Wedding')">
                        <div class="category-icon">
                            <i class="bi bi-gift"></i>
                        </div>
                        <span>Wedding</span>
                    </div>

                    <div class="category" onclick="filterCategory('Cupcake')">
                        <div class="category-icon">
                            <i class="bi bi-cake2"></i>
                        </div>
                        <span>Cupcakes</span>
                    </div>

                </div>


                <!-- FILTERS -->
                <h5 class="section-title mt-4">Filters</h5>

                <div class="row g-4">

                    <!-- PRICE -->
                    <div class="col-md-6">

                        <label class="filter-label">
                            Price Range
                        </label>

                        <div class="price-values">
                            <span>₹<span id="minPrice">0</span></span>
                            <span>₹<span id="maxPrice">2500</span>+</span>
                        </div>

                        <input
                            type="range"
                            class="form-range"
                            min="0"
                            max="2500"
                            value="2500"
                            id="priceRange"
                        >

                    </div>


                    <!-- FLAVOR -->
                    <div class="col-md-6">

                        <label class="filter-label">
                            Flavor
                        </label>

                        <select id="flavorFilter" class="form-select">
                            <option value="All">All Flavours</option>
                            <option value="Chocolate">Chocolate</option>
                            <option value="Vanilla">Vanilla</option>
                            <option value="Red Velvet">Red Velvet</option>
                            <option value="Butterscotch">Butterscotch</option>
                        </select>

                    </div>


                    <!-- SHAPE -->
                    <div class="col-md-6">

                        <label class="filter-label">
                            Shape
                        </label>

                        <select id="shapeFilter" class="form-select">
                            <option value="All">All Shapes</option>
                            <option value="Round">Round</option>
                            <option value="Square">Square</option>
                            <option value="Heart">Heart</option>
                        </select>

                    </div>


                    <!-- SORT -->
                    <div class="col-md-6">

                        <label class="filter-label">
                            Sort By
                        </label>

                        <select id="sortFilter" class="form-select">
                            <option value="popular">Popularity</option>
                            <option value="low">Price: Low to High</option>
                            <option value="high">Price: High to Low</option>
                            <option value="name">Name</option>
                        </select>

                    </div>

                </div>


                <!-- MOBILE / EXTRA CAKE CARDS -->
                <div class="row g-3 mt-4" id="cakeContainer"></div>

            </div>


            <!-- RIGHT SIDE -->
            <div class="col-12">

                <div class="popular-box">

                    <h5>Popular Cakes</h5>


                    <!-- CAKE 1 -->
                    <div class="popular-cake">

                        <img
                            src="choco.png"
                            alt="Chocolate Truffle Cake"
                        >

                        <div class="cake-info">

                            <h6>Chocolate Truffle</h6>

                            <strong>₹1,299</strong>

                            <button onclick="viewCake('Chocolate Truffle')">
                                View Details
                            </button>

                        </div>

                    </div>


                    <!-- CAKE 2 -->
                    <div class="popular-cake">

                        <img
                            src="Red velvet (1).png"
                            alt="Red Velvet Cake"
                        >

                        <div class="cake-info">

                            <h6>Red Velvet</h6>

                            <strong>₹1,499</strong>

                            <button onclick="viewCake('Red Velvet')">
                                View Details
                            </button>

                        </div>

                    </div>


                    <!-- CAKE 3 -->
                    <div class="popular-cake">

                        <img
                            src="Butterscoth.png"
                            alt="Butterscotch Cake"
                        >

                        <div class="cake-info">

                            <h6>Butterscotch</h6>

                            <strong>₹1,399</strong>

                            <button onclick="viewCake('Butterscotch')">
                                View Details
                            </button>

                        </div>

                    </div>


                    <button
                        class="view-more"
                        onclick="showAllCakes()"
                    >
                        View More Cakes
                        <i class="bi bi-arrow-right"></i>
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- BOOTSTRAP JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="script.js">
    const cakes = [

    {
        name: "Chocolate Truffle",
        price: 1299,
        flavor: "Chocolate",
        shape: "Round",
        category: "Birthday",
        image: "images/chocolate-cake.jpg"
    },

    {
        name: "Red Velvet",
        price: 1499,
        flavor: "Red Velvet",
        shape: "Round",
        category: "Anniversary",
        image: "images/red-velvet.jpg"
    },

    {
        name: "Butterscotch",
        price: 1399,
        flavor: "Butterscotch",
        shape: "Round",
        category: "Birthday",
        image: "images/butterscotch.jpg"
    },

    {
        name: "Vanilla Dream",
        price: 999,
        flavor: "Vanilla",
        shape: "Square",
        category: "Wedding",
        image: "images/vanilla-cake.jpg"
    }

];


let selectedCategory = "All";


/* CATEGORY FILTER */

function filterCategory(category) {

    selectedCategory = category;

    document.querySelectorAll(".category").forEach(item => {
        item.classList.remove("active");
    });

    event.currentTarget.classList.add("active");

    filterCakes();
}


/* SEARCH */

function searchCake() {
    filterCakes();
}


/* FILTER */

function filterCakes() {

    const search =
        document.getElementById("searchInput")
        .value
        .toLowerCase();

    const flavor =
        document.getElementById("flavorFilter").value;

    const shape =
        document.getElementById("shapeFilter").value;

    const maxPrice =
        Number(document.getElementById("priceRange").value);


    let filtered = cakes.filter(cake => {

        const searchMatch =
            cake.name.toLowerCase().includes(search);

        const categoryMatch =
            selectedCategory === "All" ||
            cake.category === selectedCategory;

        const flavorMatch =
            flavor === "All" ||
            cake.flavor === flavor;

        const shapeMatch =
            shape === "All" ||
            cake.shape === shape;

        const priceMatch =
            cake.price <= maxPrice;


        return (
            searchMatch &&
            categoryMatch &&
            flavorMatch &&
            shapeMatch &&
            priceMatch
        );

    });


    sortCakes(filtered);

}


/* SORT */

function sortCakes(filtered) {

    const sort =
        document.getElementById("sortFilter").value;


    if (sort === "low") {
        filtered.sort((a, b) => a.price - b.price);
    }

    if (sort === "high") {
        filtered.sort((a, b) => b.price - a.price);
    }

    if (sort === "name") {
        filtered.sort((a, b) =>
            a.name.localeCompare(b.name)
        );
    }


    displayCakes(filtered);
}


/* DISPLAY CAKES */

function displayCakes(filtered) {

    const container =
        document.getElementById("cakeContainer");

    container.innerHTML = "";


    if (filtered.length === 0) {

        container.innerHTML = `
            <div class="col-12 text-center">
                <p class="text-danger fw-bold">
                    No cakes found!
                </p>
            </div>
        `;

        return;
    }


    filtered.forEach(cake => {

        container.innerHTML += `

            <div class="col-md-4">

                <div class="cake-card">

                    <img
                        src="${cake.image}"
                        alt="${cake.name}"
                    >

                    <h6>${cake.name}</h6>

                    <strong>
                        ₹${cake.price}
                    </strong>

                    <button
                        onclick="viewCake('${cake.name}')"
                        class="mt-2"
                    >
                        View Details
                    </button>

                </div>

            </div>

        `;

    });

}


/* PRICE */

document
    .getElementById("priceRange")
    .addEventListener("input", function () {

        document.getElementById("maxPrice")
            .innerText = this.value;

        filterCakes();

    });


/* OTHER FILTERS */

document
    .getElementById("flavorFilter")
    .addEventListener("change", filterCakes);

document
    .getElementById("shapeFilter")
    .addEventListener("change", filterCakes);

document
    .getElementById("sortFilter")
    .addEventListener("change", filterCakes);


/* VIEW DETAILS */

function viewCake(name) {

    alert(
        "You selected: " + name
    );

}


/* VIEW MORE */

function showAllCakes() {

    selectedCategory = "All";

    document.getElementById("searchInput").value = "";

    document.getElementById("flavorFilter").value = "All";

    document.getElementById("shapeFilter").value = "All";

    document.getElementById("priceRange").value = 2500;

    document.getElementById("maxPrice").innerText = "2500";

    filterCakes();

}


/* INITIAL DISPLAY */

displayCakes(cakes);
</script>

</body>
</html>
